apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flask-app-testing
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/L00204886/argocd-ml-gitops.git
    targetRevision: main
    path: k8s/overlays/testing
  destination:
    server: https://kubernetes.default.svc
    namespace: testing
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flask-app-production
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/L00204886/argocd-ml-gitops.git
    targetRevision: main
    path: k8s/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  # No automated syncPolicy here: production remains OutOfSync until manually approved!
