name: Build Multi-Arch Image & Update GitOps Tag

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/ci-gitops.yaml"

permissions:
  contents: write

concurrency:
  group: ci-gitops-main
  cancel-in-progress: false

jobs:
  build-and-bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Compute immutable short Git SHA
        id: meta
        run: |
          SHORT_SHA="$(git rev-parse --short=7 "${GITHUB_SHA}")"
          IMAGE_NAME="${IMAGE_NAME:-flask-ml-app}"
          echo "short_sha=${SHORT_SHA}" >> "${GITHUB_OUTPUT}"
          echo "image_repo=docker.io/${DOCKERHUB_USERNAME}/${IMAGE_NAME}" >> "${GITHUB_OUTPUT}"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_NAME: ${{ vars.IMAGE_NAME }}

      - name: Set up QEMU for arm64 + amd64 cross-builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-arch image (linux/amd64,linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: ./app
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.short_sha }}
          tags: |
            ${{ steps.meta.outputs.image_repo }}:${{ steps.meta.outputs.short_sha }}
            ${{ steps.meta.outputs.image_repo }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Kustomize image tag in Git
        env:
          IMAGE_REPO: ${{ steps.meta.outputs.image_repo }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git pull --rebase origin main

          python3 - <<'PY'
          import os, pathlib, re

          p = pathlib.Path("k8s/base/kustomization.yaml")
          text = p.read_text()
          text = re.sub(r"(newName:\s*).*", rf"\g<1>{os.environ['IMAGE_REPO']}", text)
          text = re.sub(r"(newTag:\s*).*", f'\\g<1>"{os.environ["SHORT_SHA"]}"', text)
          p.write_text(text)
          PY

          if git diff --quiet k8s/base/kustomization.yaml; then
            echo "kustomization.yaml already at ${SHORT_SHA}; nothing to commit."
            exit 0
          fi

          git add k8s/base/kustomization.yaml
          git commit -m "chore(gitops): bump flask-app image to ${SHORT_SHA}"
          git push origin main
