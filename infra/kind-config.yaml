# 3-Node kind Cluster Configuration (1 control-plane + 2 workers)
# Kept in infra/ outside k8s/ so ArgoCD never attempts to parse it as a Kubernetes workload.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      # Maps macOS localhost:80 -> control-plane container:80 (where ingress-nginx-controller is pinned)
      - containerPort: 80
        hostPort: 80
        protocol: TCP
  - role: worker
  - role: worker
