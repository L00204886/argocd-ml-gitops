apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: testing

resources:
  - ../../base

replicas:
  - name: flask-app
    count: 1

patches:
  - target:
      kind: Ingress
      name: flask-app-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: testing.localhost
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: flask-app
      spec:
        template:
          spec:
            containers:
              - name: flask-app
                env:
                  - name: APP_ENV
                    value: testing
